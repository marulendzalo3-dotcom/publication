            <h2>MY VALUE</h2>

            <p>
              There’s a cry in depths of Africa for something believed to be freedom, the people seek liberation from commercial and mental slavery disguised as democracy and living has become a struggle for most Africans. The access to opportunity is limited and the illiterate seem to be left out of all considerations for development there seems to be no place for them here except a wage making another white man even wealthier than they should be while poverty rages in black homes. The development of Africa has become attached to economic gain of cooperation’s rather than fixing the damages that have come about in our societies because of our history, abuse and exploitation. unattended matters continue to make life in townships and rural areas especially difficult. Do we even have the same definition of what we consider to be difficulties and struggle? Do we see that a certain type of people is suffering more, and it doesn’t seem like things will improve as the situations worsen every day. Why do we allow these cruelties to occur in our societies? Lack of knowledge about self is causing continued tribalism in societies as we fail to unite and have no problem destroying or even killing our own people.

ll deeper in credit. Freedom should intel free will of the people and all things should be easily attained and assessed by the people. But this is not the case, are we really born free? 
the flames of opportunities granted to people are often extinguished by the need for money to make them a reality or lack of ‘connection’ which is what opens doors these days. Most households surviving barely making enough to save for other things they desire. Rural poverty a reality and separate development failing amongst black people as tribalism hinders collaboration. We seem to be competing to see who staving less meanwhile we all remain starving and at the mercy of industrialization and all other mechanisms and institutions governing the institutions governing the system.

 beings and inferior to Caucasians. This superiority/inferiority conundrum expresses itself in the differential way through which they view and treat people of African and European origins.(Benzi ka-Soko)

if the discrimination against blacks is supported by a system that has made an interiority complex to develop within most black people,  Nelson Mandela intended for the Constitution to liberate us, not consign us to further dispossession. Limiting them to what they can and cannot do. The system is guided by the constitution and many laws in the constitution ultimately defend the oppressors and are mechanisms of oppression which were inherited and reflect a white way to life declaring our African ways absolute. One law that remains as the worst discriminatory was that against Robert Sobukwe a forgotten hero amongst the youth today. The sacrifices he made today enable us to move freely to any part of the country that we wish, and his African spirit continues to protect against other beliefs either than Africanism and the illusion of freedom fades as those who understand see that the system can be manipulated any how to serve the progress of white people while oppressing those who attempt to free others. Our history was written by someone else as we have even seen oral education die in most of our communities, so the real knowledge simply dies with those who possess it. We have forfeited our spirits to endure this torturous system of rule passed off as legal. Our dying and suffering legal. The worst is the hate of self. Evident in south Africa as tribalism and xenophobia. The fact that these words don’t have any African origins-shows that they were enforced onto to the people, an idea we were made to believe is true like that of democracy.
Black is beautiful and it’s saddening how we are the first to criticise our own people therefore making it harder for a lot of people to succeed because we keep pulling them down and we rarely collaborate to venture into new businesses that might help grow us. The hate we have for ourselves is surprising and what used to be done to us as torture in the past has become a lifestyle today and it’s self-inflicted. South African women endure mistreatment with South Africa ranking first in terms of GBV. I believe this hurt traces back to the slavery. In 1814 Baartman was sold to S. Réaux, an exhibitor in Paris, France, where the public showings continued. Réaux allowed patrons to sexually abuse Baartman, making a significant profit off her mistreatment. She also was examined by scientists. Baartman died in Paris in 1815 at about the age of 26. After Baartman’s death, scientists preserved parts of her body. For many years, her remains were displayed in a museum in Paris to support racist theories surrounding those of African ancestry. In 1994 Nelson Mandela, the new president of South Africa, asked France to return Baartman’s remains to South Africa. In 2002 France agreed, and Baartman’s remains were buried near her birthplace in Eastern Cape province. Today south African women have no respect for themselves. Selling their bodies all because of trauma and circumstances, the need to provide or simply live out a ‘soft life’. Women simply reduced to beauty as the worldview made them such. Money is even buying love today. It’s not even debatable black people are the poorest. Why is it that we have no interest in finding out why things are as they are?
We are failing to unify trying to advance as individuals than as a collective because we don’t see how were ALL put in this state of struggle. You cannot really get comfortable as a black man that will result in suffering. The people are capable of extraordinary development unified that’s probably why other people have always come to destroy or separate black people. Destruction is self-imposed sometimes for example Nigerians in south Africa. We fail to see how we are all one side because we are competing, and tribalism is still on high in the townships. We continue to sell drugs to our young, kill, torment and abuse our own people. Foreign concepts like xenophobia and democracy are being allowed to operate here as if we do not have older methods that made our countries prosper way before colonisation. rather than making names for new problems provide solutions instead for both old and new problems without seeking help elsewhere outside Africa. WE SHOULDN’T HATE OURSELVES. WE SHOULD BE ALLOWED TO BE. FOR IN THIS SYSYTEM OUR SOULS IS ALL WE WILL EVER TRULY OWN.WE CANNOT KEEP GIVING AWAY OUR POWER.

What put Sarah baartman on show, today our young queens are putting on show for free on social media and some even live on the streets all in the name of fashion, relevance and the need to survive. The system has successfully TAUGHT us to disrespect ourselves, brothers and sisters. we easily underestimate ourselves and there’s high levels of self-doubt while we believe someone can help us out of our situation , while setting the standards we can barely maintain. The fearlessness of the warriors that confronted with but spears an armed military has turned into these weak people that need validation, egotist people that even though losing the war pride themselves in still being alive. Said to be worthless and have a specific role chose for them. Roles determined by several factors set up to the system. Uniform behaviour, we all know that one guy doing the same thing e.g. we all know an alcoholic, abuser and academia.

A people that finds themselves having to beg for help. Inactive people hoping for financial aid to change their circumstances never willing to invest because there’s always something to do or envied. The future is in all our hands, but with family conflicts further separating our people mostly because money it becomes hard to build a prosperous nation for all. We have been divided but we must ask ourselves if we accept to be conquered, to give in and accept to continue living in this modernised system where lives can be bought or do we choose to control of our fates. Is the wealth that we are after worth it if it costs us our mental and physical health. Show me an institution that was built for the benefit the people and not for advancing western perspectives. All these built to keep us systematically oppressed.
   They subsequently will experience failure to achieve academically, and then fail to perform adequately on scholastic achievement tests. Because of the frustration from being stressed and inadequately cared for, they will fail to attend school. Eventually they will drop out of school. Many Black children and youth will become involved with drugs- either to medicate often unrecognized Major depression, or to sell drugs to solve their own or their family’s financial difficulties. Perhaps both. The drugs will be used to suspend Briefly a grinding sense of hopelessness and doom. Then addiction sets In. Other Black children and youth will become obsessed with sexual Activity to compensate for a profound sense of unmet dependency needs. This view seems like a prophecy.
All these institutions of learning that teach of white dominance and principles that are adopted from the west, the police to keep us in order-black on black violence set up by a system because self-hate runs deep, colour institutions-educational, health and commercial-that eliminate black people from participating because they are ‘private’. Who is really benefiting especially within these borders from the existence of these institutions. Inequality still runs high and the people at the bottom feeling the effects of the system more than any other persons that are living in this country constantly being denied the simple right to live their lives to their fullest, so they find other escapes. Literacy being the only key we were handed, learn then you would be able to make it in this life being the only ultimatum in our country.
Nobody should be made to believe they are stupid because the world of work has its required skill sets. Who and for what purpose were these institutions built? one purpose only -clearly not for the not for the benefit of our people but financial gain. Surely these reasons haven’t changed and until we build our own, we will keep working hard so we can enrich stakeholders who couldn’t care any less about us. Here we were chasing qualifications that taught us to further worship the white man, overlooking our own prosperous findings. Knowledge from our old university kept from us with what being taught being what’s relevant. Even after obtaining these qualifications our future is still uncertain. Youth unemployment at an alarming rate of 68% because we are waiting for jobs rather than creating. Who knows what we want if not ourselves.
The lives of the people hanging are in the balance with almost everything having to be fought for or given. And when we take to the streets we are labelled savages, enemies of progress or barbarians. The lives of our sister at danger at every turn, they murdered, abused and used by conflicted sick men. Even when she’s unnoticed she is still in fear. But you can’t blame her, we have seen males performing outrageous acts. While the cooperation’s grow stronger and recruiting more people, security is not available as mothers’ hearts race whenever they see men along their way to go secure a monthly stipend , for some their children’s only hope. The children mind stolen. Guided by trends and material. In South Africa, a father is how much money he can provide at the end of the month because we emphasise provider roles and financial success as primary measures of a father’s worth. If we are not careful, we will not have lost land only but our future generations as they lose knowledge of self and exposed to more western ways of living. The absence of fathers affects the development of children and has had detrimental consequences for families and for society as a whole.  
It is not only Africans dying by their heritage as well. We are driven by our exterior environment while mind and body take heavy damage as we continue to consume harmful substances and information. In South Africa 40% of men have beaten their partners and one in four has committed sexual crimes. This is what is considered normal.
It is as if we have accepted that we will forever make for some more money for someone, and they’ll just give us share. A big boss, baas, legowa, umlungu. The one with the German car you wish you had. This means someone will always have a say in your life, power over your financial state the determinant of your level of content. Covid 19 saw many lose their jobs because companies prefer profits over the livelihoods of their employees. You die today, you are replaced tomorrow. Your financial state determines your mental state, the biochemistry that your brain operates. The broke are angry look in townships. Blind to the truth or maybe uninterested in knowing the facts. Sheep in need of a shepherd to guide us through life, lucky are those born white or those that fought their way to the top unfortunate we lost a few along the way. 
They have systematically formatted our memory now the new owner must use the people as puppets, workers, yes man, servants, evidence that we are losing not only our minds but our rightful place in this land. We have lost a lot already under an illusion, the mind believed it was free and tried to be. Only to find that it’s getting worse the people have lost their ways for one they were taught and believe.  The term “township” has no formal definition but is commonly understood to refer to the underdeveloped, usually (but not only) urban, residential areas that during Apartheid were reserved for non-whites (Africans, Coloureds and Indians) who lived near or worked in areas that were designated ‘white only’ (under the Black Communities Development Act (Section 33) and Proclamation R293 of 1962, Proclamation R154 of 1983 and GN R1886 of 1990 in Trust Areas, National Home lands and Independent States). Is this the view we want to give about our homes. When shall the student be the master. How do we gain when most things are set up to keep us back? In this race for life, it’s hard to win when you are starting further back. The place I live in is already behind that’s why we want to move to a better one, if we only went back in time understand why we are the way we are.
Generations of suffering and with the advancement of technology we are losing ourselves earlier and faster due to early exposure. AI is also expected to have a disruptive effect on the composition of the labour market. We can’t research why it is that we find ourselves repeating the same cycles and refusing to change ourselves although the world is. for us to progress, we need to understand the reasons behind this circumstance that the people find themselves in, came to be. Why our brains operate on this program and what this means for the survival of the people. Everything starts with a thought. We just need to put in the effort to make sure we change our circumstances. We need to ask ourselves HOW DO I HEAL FROM THE PAST SO I MAY PROGRESS AND ADD VALUE TO MY COMMUNITY? HOW DO I PRESERVE MY CULTURE SO MY CHILDREN DO NOT ADOPT A FOREIGN CULTURE OR RELIGION? DO I CHOOSE TO LIVE OUT THE REST OF MY LIFE IN SURVIVAL MODE OR DO I STOP TAKING THE SAME ACTIONS THAT WILL TAKE ME BACK TO THE SAME POINT? SUFFERING.

/* ============================================================
   STATE
============================================================ */

let currentPage = 0;

let fontSize = 18;


/* ============================================================
   RENDER PAGE
============================================================ */

function renderPage() {

    const page = pages[currentPage];

    const pageElement =
        document.getElementById("pageContent");

    pageElement.innerHTML = page.content;

    pageElement.className = "page";

    if (page.cover) {
        pageElement.classList.add("cover-page");
    }

    /* Page number */

    const number = document.createElement("div");

    number.className = "page-number";

    number.innerText =
        `${currentPage + 1}`;

    pageElement.appendChild(number);


    /* Counter */

    document.getElementById("counter").innerText =
        `Page ${currentPage + 1} of ${pages.length}`;


    /* Progress */

    const progress =
        ((currentPage + 1) / pages.length) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";


    /* Buttons */

    document.getElementById("previous").disabled =
        currentPage === 0;

    document.getElementById("next").disabled =
        currentPage === pages.length - 1;


    /* Highlight TOC */

    const tocButtons =
        document.querySelectorAll(".toc button");

    tocButtons.forEach((button, index) => {

        button.classList.toggle(
            "active",
            index === currentPage
        );

    });


    /* URL */

    history.replaceState(
        null,
        "",
        "#page=" + (currentPage + 1)
    );


    /* Remember page */

    localStorage.setItem(
        "bookPage",
        currentPage
    );

}


/* ============================================================
   NEXT PAGE
============================================================ */

function nextPage() {

    if (currentPage < pages.length - 1) {

        currentPage++;

        renderPage();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

}


/* ============================================================
   PREVIOUS PAGE
============================================================ */

function previousPage() {

    if (currentPage > 0) {

        currentPage--;

        renderPage();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

}


/* ============================================================
   TABLE OF CONTENTS
============================================================ */

function createTOC() {

    const toc =
        document.getElementById("toc");

    pages.forEach((page, index) => {

        const button =
            document.createElement("button");

        button.innerText =
            page.title
            ? `${index + 1}. ${page.title}`
            : `Page ${index + 1}`;

        button.onclick = function() {

            currentPage = index;

            renderPage();

            if (window.innerWidth < 800) {
                toggleMenu();
            }

        };

        toc.appendChild(button);

    });

}


/* ============================================================
   DARK MODE
============================================================ */

function toggleDark() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "darkMode",
        dark
    );

}


/* ============================================================
   FONT SIZE
============================================================ */

function changeFont(amount) {

    fontSize += amount;

    if (fontSize < 14)
        fontSize = 14;

    if (fontSize > 30)
        fontSize = 30;

    document.querySelector(".page").style.fontSize =
        fontSize + "px";

    localStorage.setItem(
        "fontSize",
        fontSize
    );

}


/* ============================================================
   MOBILE MENU
============================================================ */

function toggleMenu() {

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* ============================================================
   KEYBOARD NAVIGATION
============================================================ */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowRight" ||
            event.key === "PageDown"
        ) {

            nextPage();

        }

        if (
            event.key === "ArrowLeft" ||
            event.key === "PageUp"
        ) {

            previousPage();

        }

    }
);


/* ============================================================
   SEARCH
============================================================ */

function searchBook() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    if (!search) return;


    const result =
        pages.findIndex(page =>
            page.content
                .toLowerCase()
                .includes(search)
        );


    if (result !== -1) {

        currentPage = result;

        renderPage();

    } else {

        alert(
            "The search term was not found in the book."
        );

    }

}


/* ============================================================
   RESTORE SETTINGS
============================================================ */

function restoreSettings() {

    const savedPage =
        localStorage.getItem("bookPage");

    if (savedPage !== null) {

        currentPage =
            parseInt(savedPage);

    }


    const savedFont =
        localStorage.getItem("fontSize");

    if (savedFont !== null) {

        fontSize =
            parseInt(savedFont);

    }


    const dark =
        localStorage.getItem("darkMode");

    if (dark === "true") {

        document.body.classList.add("dark");

    }

}


/* ============================================================
   OPEN PAGE FROM URL
============================================================ */

function loadURLPage() {

    const hash =
        window.location.hash;

    if (hash.startsWith("#page=")) {

        const number =
            parseInt(
                hash.replace("#page=", "")
            );

        if (
            number >= 1 &&
            number <= pages.length
        ) {

            currentPage = number - 1;

        }

    }

}


/* ============================================================
   START APPLICATION
============================================================ */

restoreSettings();

loadURLPage();

createTOC();

renderPage();

</script>
